; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:scan]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<scan/>
lib_deps = 
	functionpointer/arduino-MLX90393@^1.0.2
	adafruit/Adafruit MLX90393@^2.0.5
	sparkfun/SparkFun TMP102 Breakout@^1.1.2

[env:heatmap]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<heatmap/>
monitor_speed = 115200
lib_deps = 
	functionpointer/arduino-MLX90393@^1.0.2
	adafruit/Adafruit MLX90393@^2.0.5
	sparkfun/SparkFun TMP102 Breakout@^1.1.2

[env:troubleshooting]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<troubleshooting/>
lib_deps = 
	functionpointer/arduino-MLX90393@^1.0.2
	adafruit/Adafruit MLX90393@^2.0.5
	sparkfun/SparkFun TMP102 Breakout@^1.1.2

[env:tracking]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<tracking/>
lib_deps = 
	functionpointer/arduino-MLX90393@^1.0.2
	adafruit/Adafruit MLX90393@^2.0.5
	sparkfun/SparkFun TMP102 Breakout@^1.1.2

[env:initial_mapping]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 250000
build_src_filter = +<initial_mapping/>
lib_deps = 
	functionpointer/arduino-MLX90393@^1.0.2
	adafruit/Adafruit MLX90393@^2.0.5
	sparkfun/SparkFun TMP102 Breakout@^1.1.2
